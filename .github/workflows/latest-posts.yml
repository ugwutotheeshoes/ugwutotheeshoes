# Keeps the "Latest posts" list in README.md in sync with dev.to.
# Runs daily, and can be started by hand from the Actions tab.
name: Latest dev.to posts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/ugwutotheeshoes"
          max_post_count: 5
          commit_message: "Update latest dev.to posts"
